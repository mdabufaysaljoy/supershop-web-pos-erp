# ==============================================================================
# Supershop Production Nginx Virtual Hosts
# Routes:
#   - /api/     -> Node.js API (api:4000)
#   - /media/   -> Local persistent storage (/var/media)
#   - /admin/   -> Admin SPA (admin:80)
#   - /         -> Next.js Storefront (storefront:3000)
# ==============================================================================

upstream api_backend {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream storefront_backend {
    server storefront:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream admin_backend {
    server admin:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ---------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS Main Server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # SSL / TLS Configuration
    ssl_certificate /etc/letsencrypt/live/supershop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supershop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------ Static Media Files
    # Direct nginx file serving for uploaded product/brand/site images
    location /media/ {
        alias /var/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
        access_log off;
    }

    # ------------------------------------------------------------ API Routes
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for streaming / SSE endpoints
        proxy_buffering off;
    }

    # ------------------------------------------------------------ Admin SPA
    # When accessed via /admin path
    location /admin {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------ Next.js Static Cache
    location /_next/static/ {
        proxy_pass http://storefront_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ------------------------------------------------------------ Storefront Root
    location / {
        proxy_pass http://storefront_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
