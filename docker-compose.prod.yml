# ==============================================================================
# Production Docker Compose for Supershop Monorepo
# Orchestrates: MongoDB (replica set rs0), Redis (AOF), Node API, Admin SPA,
# Next.js Storefront, Nginx Reverse Proxy (SSL + Gzip), and Certbot.
# ==============================================================================
name: supershop-prod

services:
  # ---------------------------------------------------------------- MongoDB
  mongo:
    image: mongo:8.0
    restart: always
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # ---------------------------------------------------------------- Redis
  redis:
    image: redis:7.4-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # ---------------------------------------------------------------- API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/supershop?directConnection=true
      - REDIS_URL=redis://redis:6379
      - API_PORT=4000
      - MEDIA_LOCAL_DIR=/app/var/media
      - TRUST_PROXY=1
    volumes:
      - media-data:/app/var/media
      - backup-data:/app/var/backups
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:4000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # ---------------------------------------------------------------- Admin SPA
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: always
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------- Storefront (SSR)
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://api:4000}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # ---------------------------------------------------------------- Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
      - storefront
      - admin
    volumes:
      - ./tools/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tools/deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
      - media-data:/var/media:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # ---------------------------------------------------------------- Certbot (SSL Renewal)
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------- LibreTranslate (Optional)
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ['translation']
    restart: unless-stopped
    environment:
      LT_HOST: 0.0.0.0
      LT_LOAD_ONLY: en,ar
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    expose:
      - '5000'
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)",
        ]
      interval: 20s
      timeout: 10s
      retries: 40
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mongo-data:
  mongo-config:
  redis-data:
  media-data:
  backup-data:
  certbot-etc:
  certbot-var:
  libretranslate-models:
